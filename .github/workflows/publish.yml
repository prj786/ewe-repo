# Build and publish the [ewe] pacman repository.
#
# Output: the rolling `x86_64` release of this repo carries ewe.db + every
# .pkg.tar.zst, so a pacman.conf stanza of
#
#   [ewe]
#   SigLevel = Optional TrustAll
#   Server = https://github.com/prj786/ewe-repo/releases/download/x86_64
#
# makes `pacman -Syu` update the whole DE. Contents per run:
#   - ewe            — built here from prj786/ewe's packaging/PKGBUILD, pkgver
#                      pinned to that repo's LATEST release tag
#   - komble-arch    — latest release asset of prj786/komble-arch
#   - ewe-settings   — latest release asset of prj786/ewe-settings
#   - ewe-sync       — latest release asset of prj786/ewe-sync (RFC-006, the account app)
#   - aur-packages.txt entries — built from their AUR PKGBUILDs in this clean
#                      Arch container
#
# The release is deleted and recreated each publish so stale versions never
# accumulate next to the db (pacman only reads the db, but humans read the
# asset list). Trigger manually after any app release, or let the weekly run
# refresh the AUR builds.

name: publish
on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish]
  schedule:
    - cron: '17 4 * * 1'   # Mondays — keep the AUR -bin packages from rotting

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare toolchain and an unprivileged builder (makepkg refuses root)
        run: |
          pacman -Syu --noconfirm git github-cli sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: Collect the first-party app packages (latest releases)
        run: |
          mkdir -p pkgs
          gh release download --repo prj786/komble-arch  --pattern '*.pkg.tar.zst' --dir pkgs
          gh release download --repo prj786/ewe-settings --pattern '*.pkg.tar.zst' --dir pkgs
          # ewe-sync (RFC-006): a warning, not a failure, until its first release exists
          gh release download --repo prj786/ewe-sync --pattern '*.pkg.tar.zst' --dir pkgs \
            || echo "::warning::ewe-sync has no release yet — the repo will not carry it this round"
          ls -l pkgs

      - name: Build the ewe package (pkgver = latest ewe release tag)
        # RFC-005 (2026-09-02): the package ships NO Google client any more.
        # The ewe account is the user's own Nextcloud (ewe-cloud, Login Flow
        # v2); Google is optional and needs the user's own client file at
        # ~/.config/ewe/oauth-client.json. The EWE_OAUTH_CLIENT secret and its
        # injection are gone. This branch merges together with ewe's
        # `nextcloud` branch (DE 0.10.0) — publishing it against an older ewe
        # tag would fail the contents assertion below, by design.
        run: |
          ver="$(gh release view --repo prj786/ewe --json tagName -q .tagName)"
          git clone --depth 1 https://github.com/prj786/ewe.git /tmp/ewe
          cd /tmp/ewe/packaging
          sed -i "s/^pkgver=.*/pkgver=${ver#v}/" PKGBUILD
          chown -R builder .
          sudo -u builder makepkg -df --noconfirm
          cp ewe-*.pkg.tar.zst "$GITHUB_WORKSPACE/pkgs/"

      - name: Assert the ewe package CONTENTS (what a fresh install actually gets)
        # 2026-09-01: a package once shipped without a file nothing noticed
        # until a VM test showed "Not configured" in Settings → User. The build
        # going green is not the same as the box being complete: list what
        # MUST be inside. Since RFC-005 the account tools are ewe-cloud (the
        # Nextcloud broker), ewe-caldav and ewe-mail; ewe-auth stays for the
        # optional Google client the user brings; no oauth-client.json is
        # expected — the package must NOT carry one.
        run: |
          pkg="$(ls "$GITHUB_WORKSPACE"/pkgs/ewe-*.pkg.tar.zst | head -1)"
          tar --zstd -tf "$pkg" > /tmp/ewe-pkg-files
          fail=0
          for want in \
            usr/share/ewe/dotfiles/quickshell/shell.qml \
            usr/share/ewe/dotfiles/hypr/start-hyprland.sh \
            usr/share/ewe/system/greetd/config.toml \
            usr/share/ewe/system/branding/wallpapers/ \
            usr/share/ewe/VERSION \
            usr/share/ewe/docs/NEXTCLOUD.md \
            usr/bin/ewe-setup usr/bin/ewe-conf usr/bin/ewe-auth usr/bin/ewe-drive \
            usr/bin/ewe-cloud usr/bin/ewe-caldav usr/bin/ewe-mail; do
            grep -qx "$want" /tmp/ewe-pkg-files || { echo "::error::missing from the ewe package: $want"; fail=1; }
          done
          # the account app is a dependency of the desktop (RFC-006)
          tar --zstd -xOf "$pkg" .PKGINFO | grep -q '^depend = ewe-sync' \
            || { echo "::error::the ewe package does not depend on ewe-sync"; fail=1; }
          if grep -q 'oauth-client.json' /tmp/ewe-pkg-files; then
            echo "::error::the ewe package carries an oauth-client.json — RFC-005 ships no Google client"; fail=1
          fi
          [ "$fail" = 0 ] && echo "ewe package contents OK ($(wc -l < /tmp/ewe-pkg-files) files)"
          exit $fail

      - name: Build the ewe-cast package (pkgver = latest ewe-cast release tag)
        run: |
          ver="$(gh release view --repo prj786/ewe-cast --json tagName -q .tagName 2>/dev/null || true)"
          if [ -z "$ver" ]; then
            echo "::warning::ewe-cast has no release yet — the repo will not carry it this round"
            exit 0
          fi
          git clone --depth 1 https://github.com/prj786/ewe-cast.git /tmp/ewe-cast
          cd /tmp/ewe-cast/packaging
          sed -i "s/^pkgver=.*/pkgver=${ver#v}/" PKGBUILD
          chown -R builder .
          sudo -u builder makepkg -df --noconfirm
          cp ewe-cast-*.pkg.tar.zst "$GITHUB_WORKSPACE/pkgs/"

      - name: Build the AUR packages
        run: |
          while read -r p; do
            echo "::group::$p"
            git clone --depth 1 "https://aur.archlinux.org/$p.git" "/tmp/aur/$p"
            chown -R builder "/tmp/aur/$p"
            # source-signature packages (helium-browser-bin): import the
            # PKGBUILD's validpgpkeys into the BUILDER's keyring, or makepkg
            # dies with "unknown public key" (2026-09-02)
            keys="$(cd "/tmp/aur/$p" && sudo -u builder bash -c 'source ./PKGBUILD 2>/dev/null; echo "${validpgpkeys[@]:-}"')"
            for k in $keys; do
              sudo -u builder gpg --keyserver keyserver.ubuntu.com --recv-keys "$k"                 || sudo -u builder gpg --keyserver hkps://keys.openpgp.org --recv-keys "$k" || true
            done
            ( cd "/tmp/aur/$p" && sudo -u builder makepkg -s --noconfirm --noprogressbar )
            find "/tmp/aur/$p" -name '*.pkg.tar.zst' ! -name '*-debug-*' \
                 -exec cp {} "$GITHUB_WORKSPACE/pkgs/" \;
            echo "::endgroup::"
          done < <(sed 's/#.*//' aur-packages.txt | awk 'NF{print $1}')

      - name: Build the local PKGBUILDs (things not on AUR — see pkgbuilds/)
        run: |
          for d in pkgbuilds/*/; do
            p=$(basename "$d")
            echo "::group::$p"
            chown -R builder "$d"
            ( cd "$d" && sudo -u builder makepkg -sf --noconfirm --noprogressbar )
            find "$d" -name '*.pkg.tar.zst' ! -name '*-debug-*' \
                 -exec cp {} "$GITHUB_WORKSPACE/pkgs/" \;
            echo "::endgroup::"
          done

      - name: Fresh-install gate — resolve `pacman -S ewe` like a new machine would
        run: |
          # The 0.9.1 package review found jack2+pipewire-jack resolving into
          # the SAME fresh install, and Afrikaans OCR data riding in via an
          # unpinned virtual. This gate re-runs that audit on every publish:
          # a scratch-db resolution of the freshly built repo must succeed,
          # contain no blacklisted package, and carry no conflicting pair.
          repo-add -q /tmp/gate.db.tar.gz pkgs/*.pkg.tar.zst
          mkdir -p /tmp/gate/local /tmp/gate/sync
          cp /var/lib/pacman/sync/{core,extra}.db /tmp/gate/sync/
          cp /tmp/gate.db.tar.gz /tmp/gate/sync/gate.db
          printf '[options]\nArchitecture = auto\nSigLevel = Never\n[gate]\nServer = file://%s/pkgs\n[core]\nInclude = /etc/pacman.d/mirrorlist\n[extra]\nInclude = /etc/pacman.d/mirrorlist\n' "$PWD" > /tmp/gate.conf
          pacman -Sp --config /tmp/gate.conf --dbpath /tmp/gate --noconfirm gate/ewe \
            | sed 's|.*/||; s|-[0-9][^-]*-[0-9][^-]*-[^-]*\.pkg\.tar\.zst||' > /tmp/tree.txt
          [ -s /tmp/tree.txt ] || { echo "::error::fresh install does not resolve"; exit 1; }
          echo "fresh install: $(wc -l < /tmp/tree.txt) packages"
          if grep -xE "jack2|tesseract-data-afr|papirus-icon-theme|iwd" /tmp/tree.txt; then
            echo "::error::blacklisted package resolved into a fresh install"; exit 1
          fi
          python - <<'PY'
          import subprocess, collections
          names=[l.strip() for l in open("/tmp/tree.txt") if l.strip()]
          out=subprocess.run(["pacman","--config","/tmp/gate.conf","--dbpath","/tmp/gate","-Si"]+names,capture_output=True,text=True).stdout
          info,cur={},None
          for line in out.splitlines():
              if line.startswith("Name"): cur=line.split(":",1)[1].strip(); info[cur]={"P":"","C":""}
              elif cur and line.startswith("Provides"): info[cur]["P"]=line.split(":",1)[1].strip()
              elif cur and line.startswith("Conflicts"): info[cur]["C"]=line.split(":",1)[1].strip()
          def parse(x): return [] if x in("","None") else [t for t in x.split()]
          def base(t): return t.split("=")[0].split("<")[0].split(">")[0]
          prov=collections.defaultdict(set)
          for n,d in info.items():
              prov[n].add(n)
              for p in parse(d["P"]): prov[base(p)].add(n)
          bad=[]
          for n,d in info.items():
              for c in parse(d["C"]):
                  if any(ch in c for ch in "<>="): continue   # versioned = alternative bound
                  hits=(prov.get(base(c),set())-{n}) & set(info)
                  if hits and base(c) not in [base(p) for p in parse(d["P"])]: bad.append((n,sorted(hits),c))
          for b in bad: print("::error::conflicting pair in fresh install:",b)
          raise SystemExit(1 if bad else 0)
          PY

      - name: Sign every package (EWE_SIGNING_KEY, fpr 639CA544…0763C1)
        env:
          EWE_SIGNING_KEY: ${{ secrets.EWE_SIGNING_KEY }}
        run: |
          pacman -S --noconfirm --needed gnupg
          echo "$EWE_SIGNING_KEY" | gpg --batch --import
          for f in pkgs/*.pkg.tar.zst; do
            gpg --batch --pinentry-mode loopback --passphrase '' \
                -u 639CA544B61509B3FC2621ABADBCD432FC0763C1 --detach-sign "$f"
          done
          ls pkgs/*.sig | wc -l

      - name: Build the repo database
        run: |
          cd pkgs
          repo-add --sign --key 639CA544B61509B3FC2621ABADBCD432FC0763C1 \
                   ewe.db.tar.gz *.pkg.tar.zst
          # GitHub release assets cannot be symlinks; repo-add leaves ewe.db as
          # one — replace both with real copies under the names pacman requests
          rm -f ewe.db ewe.files ewe.db.sig ewe.files.sig
          cp ewe.db.tar.gz ewe.db
          cp ewe.files.tar.gz ewe.files
          cp ewe.db.tar.gz.sig ewe.db.sig
          cp ewe.files.tar.gz.sig ewe.files.sig
          ls -l

      - name: Publish to the rolling x86_64 release
        run: |
          # gh resolves the release's target commit from the local checkout,
          # which the container's git refuses to read as root without this
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release delete x86_64 --cleanup-tag --yes 2>/dev/null || true
          gh release create x86_64 \
            --title "ewe package repository (x86_64)" \
            --notes "$(printf 'Rolling pacman repository for the ewe desktop.\n\n```\n[ewe]\nSigLevel = Optional TrustAll\nServer = https://github.com/prj786/ewe-repo/releases/download/x86_64\n```')" \
            pkgs/ewe.db pkgs/ewe.files pkgs/ewe.db.sig pkgs/ewe.files.sig \
            pkgs/ewe.db.tar.gz pkgs/ewe.files.tar.gz pkgs/*.pkg.tar.zst pkgs/*.pkg.tar.zst.sig
